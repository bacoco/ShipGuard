name: Dialogue hook contracts
on:
  pull_request:
    paths:
      - 'plugins/shipguard/hooks/**'
      - 'plugins/shipguard/docs/dialogue-hooks.md'
      - '.github/workflows/dialogue-hooks.yml'
      - 'CLAUDE.md'
permissions:
  contents: read
concurrency:
  group: dialogue-hooks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Runtime
        run: node --version
      - name: Hook protocol and fault fixtures
        run: node plugins/shipguard/hooks/dialogue-check-smoke-test.mjs
      - name: Model transport fixtures
        run: node plugins/shipguard/hooks/model-controller-smoke-test.mjs
      - name: Review decision fixtures
        run: node plugins/shipguard/hooks/dialogue-review-smoke-test.mjs
