interface:
  display_name: "ShipGuard Record"
  short_description: "Record browser actions as replayable test manifests."
  default_prompt: "Record a ShipGuard browser scenario for this URL."

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "shell"
      value: "node"
      description: "Run the recording helper script (requires the `playwright` npm package installed in the target project)."
    - type: "shell"
      value: "npx playwright install chromium"
      description: "Install the Playwright Chromium browser that drives the headed recorder."
