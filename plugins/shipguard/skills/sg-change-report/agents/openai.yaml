interface:
  display_name: "ShipGuard Change Report"
  short_description: "Trace a change with before and after screenshots"
  default_prompt: "Use $sg-change-report to show the same scenario before and after the change with traceable evidence."

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "shell"
      value: "git"
      description: "Inspect repository state and changed files."
