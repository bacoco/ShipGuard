interface:
  display_name: "ShipGuard Visual Review"
  short_description: "Review pre-review, visual, code, logic, and process evidence"
  default_prompt: "Use $sg-visual-review to open the unified ShipGuard evidence dashboard."

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "shell"
      value: "node"
      description: "Compare project copies before building or serving; refresh with backup only on explicit request."
    - type: "shell"
      value: "agent-browser"
      description: "Optionally open the dashboard."
