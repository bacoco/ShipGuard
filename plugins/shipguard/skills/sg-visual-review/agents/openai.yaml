interface:
  display_name: "ShipGuard Visual Review"
  short_description: "Build the interactive visual review dashboard."
  default_prompt: "Open the ShipGuard visual review dashboard."

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "shell"
      value: "node"
      description: "Build or serve the review dashboard."
    - type: "shell"
      value: "agent-browser"
      description: "Optionally open the dashboard."
