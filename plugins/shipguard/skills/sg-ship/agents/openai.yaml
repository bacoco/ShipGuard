interface:
  display_name: "ShipGuard Ship"
  short_description: "Run ShipGuard verification on the current diff"
  default_prompt: "Use $sg-ship to run ShipGuard on my current diff, adding --logic when contract or invariant checking matters."

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "shell"
      value: "git"
      description: "Resolve one scope for all ShipGuard lanes."
    - type: "shell"
      value: "agent-browser"
      description: "Optional browser lane for visual checks."
    - type: "shell"
      value: "node"
      description: "Build the unified review dashboard."
