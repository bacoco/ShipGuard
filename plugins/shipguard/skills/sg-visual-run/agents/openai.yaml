interface:
  display_name: "ShipGuard Visual Run"
  short_description: "Run browser visual tests with honest coverage."
  default_prompt: "Use $sg-visual-run to run ShipGuard visual tests for impacted routes."

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "shell"
      value: "agent-browser"
      description: "Drive browser steps and capture screenshots."
    - type: "shell"
      value: "git"
      description: "Scope visual tests to changed routes when requested."
