interface:
  display_name: "ShipGuard Code Audit"
  short_description: "Audit code changes safely; report-only unless fixes are explicit."
  default_prompt: "Use $sg-code-audit to audit my current diff and report findings without changing source files."

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "shell"
      value: "git"
      description: "Resolve the audit scope and changed files."
    - type: "shell"
      value: "node"
      description: "Build or serve the optional review dashboard."
