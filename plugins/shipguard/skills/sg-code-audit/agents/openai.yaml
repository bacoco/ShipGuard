interface:
  display_name: "ShipGuard Code Audit"
  short_description: "Codex audit: report-only; --fix awaits native validation."
  default_prompt: "Use $sg-code-audit to audit my current diff and report findings without changing source files. Apply the Codex host preflight first: report-only with --model=auto (inherit the authorized model), an assigned linked worktree per zone, native delegation and native completion tracking, then collect the original retained JSON. Refuse --fix on Codex."

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "shell"
      value: "git"
      description: "Resolve the audit scope and changed files."
    - type: "shell"
      value: "node"
      description: "Retain zone JSON with retain-zone-artifact.mjs in its own linked worktree; process Phase 5.7 replies with verification-result.mjs; build or serve the optional review dashboard."
