interface:
  display_name: "ShipGuard Mission Lock"
  short_description: "Proportional scope protection: direct, silent, or explicit"
  default_prompt: "Use $sg-mission-lock proportionately: answer simple questions directly and briefly, silently check bounded actions, and explicitly lock only complex, sensitive, or materially ambiguous work. Keep authorization guards and the user's Strict Delta choice. Separate corrections, independent requests, and pending ideas; clarify material ambiguity before delegating and keep side-task results separate from the main mission."

policy:
  allow_implicit_invocation: true
