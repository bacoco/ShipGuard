interface:
  display_name: "ShipGuard Mission Lock"
  short_description: "Proportional framing: a yes keeps its value"
  default_prompt: "Use $sg-mission-lock: answer simple questions directly and briefly, restate work requests visibly, treat the user's yes as authority for every reversible step until their next no, and ask first only for accounts and their rights, secrets, destructive actions, and production. Apply corrections, keep ideas for later pending, and keep side-task results separate."

policy:
  allow_implicit_invocation: true
