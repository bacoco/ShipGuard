# visual-tests/_config.yaml — Example configuration
base_url: "http://localhost:3000"
credentials:
  username: "testuser"
  password: "testpass"
screenshots_dir: "visual-tests/_results/screenshots"
report_path: "visual-tests/_results/report.md"
# agent_browser_path: optional, unused by default (agent-browser must be on PATH)

# Build command to rebuild the app after code changes (used by sg-visual-fix)
# Set to null or omit if no rebuild is needed (e.g., static sites)
build_command: null
# Examples:
# build_command: "docker compose up -d --build frontend"
# build_command: "npm run build && npm start"

# ── Config v2 (ShipGuard 2.5.0+) ──────────────────────────────────────────────
# version: 2

# App-under-test lifecycle (used by: shipguard serve / run --serve).
# {port} is replaced by a free port; base_url is then derived automatically.
# An unreachable app becomes an infrastructure error (exit 2), never a finding.
# app:
#   type: static-site
#   root: docs
#   start: "python3 -m http.server {port} --bind 127.0.0.1"
#   healthcheck: "/index.html"
#   startup_timeout_ms: 30000

# Named recette profiles (used by: shipguard run --profile=NAME).
# scope matches manifest paths and step URLs; checks pick the deterministic lanes.
# profiles:
#   site-accessible:
#     scope: "site-accessible"
#     checks: [page-load, local-assets, browser-errors, screenshots]
