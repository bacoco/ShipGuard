# Prerequisites: run documents/upload-and-process.yaml first to have a document available
name: "Chat about uploaded document"
description: "Ask a question about a previously uploaded document and verify the response is grounded"
priority: high
requires_auth: true
timeout: 60s
tags: [chat, rag, critical]

data:
  question: "What are the key terms and parties in this document?"

steps:
  - action: open
    url: "{base_url}/chat"

  - action: llm-check
    description: "Chat page loads with document context"
    criteria: "Chat interface is visible, document attachment or context indicator is present"
    severity: critical
    screenshot: chat-document-check.png

  - action: fill
    target: "message"
    value: "{data.question}"

  - action: press
    key: Enter

  - action: wait
    duration: 15s

  - action: llm-check
    description: "A document-referencing answer is displayed"
    criteria: "A non-empty assistant answer is displayed in response to the question, and it references the uploaded document (mentions the document or content drawn from it) — not an empty response or an error state"
    severity: critical
    screenshot: chat-response.png
